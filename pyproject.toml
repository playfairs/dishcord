[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dishcord"
version = "0.1.0"
description = "Interactive shell sessions for discord.py bots" # do we need pycord too.. :c
readme = "README.rst"
requires-python = ">=3.9"
authors = [{ name = "playfairs" }]
license = { text = "MIT" }
dependencies = [
  "discord.py>=2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "black>=24.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
